<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* layout idea: one dark world; thumb-first. Today is home, a dock at the bottom, big tap targets,
   reference text lives in sheets that open from the thing they explain. Gold is money, blu is you. */
:root {
  --ink-0: #15121d;
  --ink-1: #1e1a28;
  --ink-2: #292436;
  --line: #3a3450;
  --text: #f0ecf6;
  --text-2: #bdb6cd;
  --text-3: #8b84a1;
  --blu: #8fb0ff;
  --gold: #dcb970;
  --good: #7fcfa6;
  --warn: #e9b95f;
  --bad: #ef8a90;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 12px;
  --dock-h: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--ink-0); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body.noscroll { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blu); outline-offset: 2px; }
[hidden] { display: none !important; }
p { margin: 0; }
ul, ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 7px; }
h3 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.005em; }
h4 { font-size: 15px; font-weight: 600; margin: 8px 0 0; }
.small { font-size: 14px; color: var(--text-2); }
.small b, .small strong { color: var(--text); font-weight: 600; }
.k { font-size: 13px; font-weight: 600; color: var(--text-3); letter-spacing: 0.02em; }
.blu-t { color: var(--blu); }
.good-t { color: var(--good); }
.bad-t { color: var(--bad); }
.mono { font-family: var(--mono); font-size: 12px; }

/* ---------- lock ---------- */
.lock { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 32px 16px; }
.lock-inner { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.stages { display: flex; gap: 6px; }
.stages span { width: 26px; height: 3px; border-radius: 2px; background: var(--line); }
.stages span.on { background: var(--blu); }
.lock-stage { font-family: var(--mono); font-size: 14px; color: var(--text-2); min-height: 20px; text-align: center; }
.dots { display: flex; gap: 14px; height: 16px; align-items: center; }
.dots span { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--text-3); }
.dots span.on { background: var(--blu); border-color: var(--blu); }
.keypad { display: grid; grid-template-columns: repeat(3, 70px); gap: 14px 20px; margin-top: 6px; }
.key { width: 70px; height: 70px; border-radius: 50%; border: 1px solid var(--line); background: var(--ink-1); font-family: var(--mono); font-size: 24px; touch-action: manipulation; }
.key:active { background: var(--ink-2); }
.key.ghost { border-color: transparent; background: transparent; font-size: 18px; color: var(--text-2); }
.letters { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 6px; }
.lrow { display: flex; justify-content: center; gap: 5px; }
.lkey { flex: 0 1 32px; height: 48px; border-radius: 8px; border: 1px solid var(--line); background: var(--ink-1); font-family: var(--mono); font-size: 17px; touch-action: manipulation; }
.lkey:active { background: var(--ink-2); }
.lkey.wide { flex-basis: 54px; color: var(--text-2); }
.lock-msg { min-height: 22px; color: var(--bad); font-size: 14px; text-align: center; }
.shake { animation: shake .36s; }
@keyframes shake { 0%,100% { transform: none; } 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } * { transition: none !important; } }

/* ---------- frame ---------- */
.top { position: sticky; top: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; background: color-mix(in srgb, var(--ink-0) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-title { font-family: var(--display); font-size: 26px; line-height: 1.1; }
.top-right { display: flex; align-items: center; gap: 12px; }
.save { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); }
.save-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
.save-dot.ok { background: var(--good); }
.save-dot.warn { background: var(--warn); }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--text-2); font-size: 16px; }
.icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.wrap { max-width: 640px; margin: 0 auto; padding: 14px 16px calc(var(--dock-h) + 32px + env(safe-area-inset-bottom)); }
.page { display: flex; flex-direction: column; gap: 12px; }
.page:not(.on) { display: none; }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); height: calc(var(--dock-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: color-mix(in srgb, var(--ink-0) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
.dock button { border: 0; background: none; color: var(--text-3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; letter-spacing: 0.02em; }
.dock svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.dock button.on { color: var(--blu); }
.dock button.on svg { stroke-width: 2.1; }

/* ---------- cards & rows ---------- */
.card { background: var(--ink-1); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 10px; }
.card-head { display: flex; align-items: center; gap: 10px; min-height: 28px; }
.card-head h3 { flex: 1; }
.meta { font-size: 13px; color: var(--text-3); }
.meta b { color: var(--text); font-weight: 600; }
.i { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--blu); font-family: var(--display); font-style: italic; font-size: 17px; line-height: 1; display: grid; place-items: center; }
.r { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 4px 0; border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.card > .r:first-of-type, .card-head + .r { border-top: 0; }
label.r { cursor: pointer; }
.r-t { flex: 1; font-size: 15.5px; line-height: 1.35; }
.r-m { font-size: 13px; color: var(--text-3); text-align: right; }
.r-d { flex: 0 0 52px; font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.r input[type="checkbox"], .pill input { appearance: none; -webkit-appearance: none; flex: 0 0 auto; width: 24px; height: 24px; margin: 0; border: 1.6px solid var(--text-3); border-radius: 7px; background: transparent; display: grid; place-items: center; }
.r input[type="checkbox"]:checked { background: var(--blu); border-color: var(--blu); }
.r input[type="checkbox"]:checked::after, .pill input:checked::after { content: ""; width: 10px; height: 5px; border: 2.2px solid var(--ink-0); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.r input[type="checkbox"]:checked ~ .r-t { color: var(--text-3); }
.r.due.next { background: color-mix(in srgb, var(--blu) 10%, transparent); margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
.r.due.next .r-d { color: var(--blu); font-weight: 600; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13.5px; color: var(--text-2); }
.field.inline { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.field.inline input { width: auto; flex: 0 1 150px; }
input[type="text"], input[type="number"], input[type="time"], input[type="date"], select, textarea { background: var(--ink-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; width: 100%; font-size: 16px; }
textarea { resize: vertical; line-height: 1.45; }
input::placeholder, textarea::placeholder { color: var(--text-3); }
input[type="number"] { font-variant-numeric: tabular-nums; -moz-appearance: textfield; appearance: textfield; }
input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { min-width: 42px; min-height: 40px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--ink-2); font-size: 14px; color: var(--text-2); }
.seg button.on { background: var(--blu); border-color: var(--blu); color: var(--ink-0); font-weight: 600; }
.seg.full { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }

.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--ink-2); font-size: 20px; touch-action: manipulation; }
.stepper-v { min-width: 44px; text-align: center; font-family: var(--display); font-size: 26px; font-variant-numeric: tabular-nums lining-nums; }
.stepper-v small, .tap-v small { font-size: 0.6em; color: var(--text-3); }
.unit { font-size: 13px; color: var(--text-3); margin-left: -2px; margin-right: 2px; }

.btn { border: 1px solid var(--line); color: var(--text); background: var(--ink-2); border-radius: 10px; padding: 9px 14px; min-height: 42px; font-size: 14px; font-weight: 500; }
.btn.solid { background: var(--blu); border-color: var(--blu); color: var(--ink-0); font-weight: 600; }
.btn.small { min-height: 34px; padding: 5px 12px; font-size: 13px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.linkish { border: 0; background: none; padding: 4px 0; color: var(--blu); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.linkish.danger { color: var(--bad); }
.linkish.armed { font-weight: 700; }

/* ---------- today ---------- */
.daybar { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 8px; }
.nav-btn { height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--ink-1); font-size: 24px; color: var(--text-2); }
.daybar-mid { text-align: center; display: flex; flex-direction: column; align-items: center; }
.daybar-date { font-family: var(--display); font-size: clamp(20px, 6.2vw, 24px); line-height: 1.15; }
.progress-row { display: flex; align-items: center; gap: 12px; }
.progress-row .meter { flex: 1; }
.progress-n { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
.meter { height: 6px; background: var(--ink-2); border-radius: 3px; overflow: hidden; }
.meter-fill { height: 100%; width: 0; background: var(--blu); border-radius: 3px; transition: width .3s; }
.meter-fill.gold { background: var(--gold); }
.meter-fill.good, .m.good .meter-fill { background: var(--good); }
.m.bad .meter-fill { background: var(--bad); }

.stmt-strip { flex-direction: row; align-items: center; gap: 12px; border-color: color-mix(in srgb, var(--blu) 40%, var(--line)); }
.stmt-open { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.stmt-line { font-family: var(--display); font-style: italic; font-size: 17px; line-height: 1.3; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.stmt-open .k { color: var(--blu); }
.pills { display: flex; flex-direction: column; gap: 6px; }
.sheet .pills { flex-direction: row; flex-wrap: wrap; }
.pill { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px 5px 6px; font-size: 13px; color: var(--text-2); cursor: pointer; white-space: nowrap; }
.pill input { width: 20px; height: 20px; border-radius: 50%; }
.pill input:checked { background: var(--good); border-color: var(--good); }
.pill input:checked::after { width: 8px; height: 4px; border-width: 2px; }
.pill:has(input:checked) { border-color: color-mix(in srgb, var(--good) 50%, transparent); color: var(--good); }

.taps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tapwrap { position: relative; }
.tap { width: 100%; min-height: 92px; border: 1px solid var(--line); border-radius: 12px; background: var(--ink-2); display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 10px 12px; text-align: left; touch-action: manipulation; }
.tap:active { background: color-mix(in srgb, var(--blu) 18%, var(--ink-2)); }
.tap-v { font-family: var(--display); font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums lining-nums; }
.tap-l { font-size: 13px; color: var(--text-2); line-height: 1.25; padding-right: 34px; }
.tap-minus { position: absolute; right: 6px; bottom: 6px; width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--ink-1); color: var(--text-3); font-size: 18px; }
.tapwrap.met .tap { border-color: color-mix(in srgb, var(--good) 55%, var(--line)); }
.tapwrap.met .tap-v { color: var(--good); }

/* ---------- week ---------- */
.money { border-color: color-mix(in srgb, var(--gold) 35%, var(--line)); }
.money-in { display: flex; align-items: baseline; gap: 4px; border-bottom: 1px solid var(--line); }
.money-in .cur { font-family: var(--display); font-size: 34px; color: var(--gold); }
.money-in input { border: 0; background: transparent; font-family: var(--display); font-size: 44px; color: var(--gold); padding: 0 0 4px; min-height: 0; }
.money-in input:focus { outline: none; }
.money-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 13.5px; color: var(--text-2); }
.money-meta strong { color: var(--text); font-variant-numeric: tabular-nums; }
details.more summary { cursor: pointer; font-size: 14px; color: var(--blu); padding: 6px 0; list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "+ "; }
details.more[open] summary::before { content: "− "; }
details.more[open] { display: flex; flex-direction: column; gap: 10px; }
.meters { display: flex; flex-direction: column; gap: 12px; }
.m { display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; align-items: baseline; }
.m .meter { grid-column: 1 / -1; }
.m-l { font-size: 15px; }
.m-v { font-size: 14px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.m-v b { color: var(--text); font-size: 17px; font-weight: 600; }
.m.good .m-v b { color: var(--good); }
.m.bad .m-v b { color: var(--bad); }
.table-wrap { overflow-x: auto; margin: 0 -14px; padding: 0 14px; }
table { border-collapse: collapse; width: 100%; }
.hist th, .hist td { text-align: left; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.hist th { font-weight: 500; font-size: 12px; color: var(--text-3); }
.empty { color: var(--text-3); font-size: 14px; }

/* ---------- pipeline ---------- */
.viewpane { display: flex; flex-direction: column; gap: 12px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--ink-1); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--display); font-size: 28px; font-weight: 500; line-height: 1.05; font-variant-numeric: tabular-nums lining-nums; }
.stat span { font-size: 12.5px; color: var(--text-3); }
.trip { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; border: 1px dashed color-mix(in srgb, var(--warn) 55%, var(--line)); background: color-mix(in srgb, var(--warn) 7%, transparent); color: var(--text); border-radius: var(--r); padding: 10px 14px; text-align: left; min-height: 48px; }
.trip.static { cursor: default; }
.trip-k { font-size: 14.5px; }
.trip-v { font-size: 13px; color: var(--text-2); white-space: nowrap; }
.trip-v b { font-family: var(--display); font-size: 24px; font-weight: 500; color: var(--warn); }
.list { display: flex; flex-direction: column; gap: 8px; }
.item { background: var(--ink-1); border: 1px solid var(--line); border-radius: var(--r); }
.item summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding: 11px 14px; min-height: 52px; }
.item summary::-webkit-details-marker { display: none; }
.it-name { font-size: 15.5px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.it-name.ph { color: var(--text-3); font-weight: 400; }
.it-next { grid-column: 1 / -1; font-size: 13.5px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.it-next:empty { display: none; }
.it-amt { font-variant-numeric: tabular-nums; color: var(--text-2); font-size: 14px; }
.item details[open] summary { border-bottom: 1px solid var(--line); }
.it-edit { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.it-foot { display: flex; justify-content: flex-end; }
.chip { justify-self: end; font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--text-2); white-space: nowrap; }
.chip.good { border-color: color-mix(in srgb, var(--good) 55%, transparent); color: var(--good); }
.chip.warn { border-color: color-mix(in srgb, var(--warn) 55%, transparent); color: var(--warn); }
.chip.bad { border-color: color-mix(in srgb, var(--bad) 55%, transparent); color: var(--bad); }
.chip.muted { opacity: 0.55; }

/* ---------- music ---------- */
.hero-sm { padding: 4px 2px 2px; display: flex; flex-direction: column; gap: 2px; }
.hero-sm .k { color: var(--blu); }
.hero-sm-v { font-family: var(--display); font-size: 52px; line-height: 1; font-variant-numeric: tabular-nums lining-nums; }
.hero-sm-v small { font-size: 0.4em; color: var(--text-3); }

/* ---------- plan ---------- */
.hero { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; padding: 4px 2px; }
.hero-num { font-family: var(--display); font-size: clamp(44px, 13vw, 64px); line-height: 1; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; font-variant-numeric: tabular-nums lining-nums; }
.hero-num [data-out="balance"] { color: var(--gold); }
.hero-sep { color: var(--blu); }
.hero-target { color: var(--text-3); font-size: 0.55em; }
.bars { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.bar-row { display: grid; grid-template-columns: 40px 1fr 40px; gap: 10px; align-items: center; font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.bar-row span:last-child { text-align: right; }
.lines2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.big { font-family: var(--display); font-size: 22px; line-height: 1.25; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); }
.lg::before { content: ""; display: inline-block; width: 14px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 6px; }
.lg-actual::before { border-color: var(--gold); }
.lg-sprint::before { border-color: var(--blu); border-top-style: dashed; }
.lg-floor::before { border-color: var(--text-3); border-top-style: dashed; }
.chart { position: relative; width: 100%; min-height: 210px; }
.chart svg { display: block; width: 100%; height: 210px; overflow: visible; touch-action: pan-y; }
.chart .tip { position: absolute; pointer-events: none; background: var(--ink-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font-size: 12px; line-height: 1.5; white-space: nowrap; }
.statement-text, .identity-text { width: 100%; background: transparent; border: 0; border-radius: 0; resize: none; font-family: var(--display); font-style: italic; font-size: 21px; line-height: 1.45; padding: 0; min-height: 0; }
.identity-text { font-size: 18px; color: var(--text-2); }
.statement-text:focus, .identity-text:focus { outline: 1px dashed var(--line); outline-offset: 6px; }
.stmt-card { border-color: color-mix(in srgb, var(--blu) 40%, var(--line)); }
.freedom-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.freedom { display: flex; align-items: baseline; gap: 4px; font-family: var(--display); font-size: 28px; color: var(--gold); }
.freedom input { width: 100px; background: transparent; border: 0; border-bottom: 1px dashed var(--line); border-radius: 0; font-family: var(--display); font-size: 32px; color: var(--gold); padding: 0; min-height: 0; }
.bet { display: grid; grid-template-columns: 26px 1fr; gap: 10px; font-size: 15px; line-height: 1.4; color: var(--text-2); }
.bet b { font-family: var(--display); font-size: 24px; line-height: 1; color: var(--gold); font-weight: 500; }
.bet strong { color: var(--text); }
.bet-m b { color: var(--blu); }
.guides { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.guides button { min-height: 52px; border: 1px solid var(--line); border-radius: 10px; background: var(--ink-2); text-align: left; padding: 8px 12px; font-size: 14px; line-height: 1.3; }

/* ---------- sheet ---------- */
.sheet { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(8, 6, 14, 0.6); }
.sheet-panel { position: relative; max-height: 86vh; max-height: 86dvh; width: 100%; max-width: 640px; margin: 0 auto; background: var(--ink-1); border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(24px); } to { transform: none; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.sheet-title { font-family: var(--display); font-size: 24px; line-height: 1.15; }
.sheet-body { overflow-y: auto; padding: 14px 16px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; font-size: 15.5px; line-height: 1.5; }
.sheet-body ul, .sheet-body ol { font-size: 15px; }
.sheet-body .r { border-top: 1px solid var(--line); }
.script { font-family: var(--display); font-style: italic; font-size: 19px; }
.steps { gap: 9px; }
.slots th, .slots td { text-align: left; vertical-align: top; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.slots th { font-weight: 600; font-size: 13px; color: var(--blu); white-space: nowrap; }
.slots td.t { white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ---------- shift card & rota ---------- */
.shiftcard { border-color: color-mix(in srgb, var(--blu) 30%, var(--line)); }
.shift-select { width: auto; max-width: 58%; min-width: 0; min-height: 40px; padding: 8px 10px; font-size: 15px; }
.times { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) auto; gap: 8px; align-items: end; }
.tf { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-3); min-width: 0; }
.tf input { width: 100%; min-width: 0; padding: 8px 8px; }
.plan-label { font-family: var(--display); font-size: 22px; line-height: 1.2; }
.plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.plan-grid div { display: flex; flex-direction: column; gap: 1px; }
.plan-grid .wide { grid-column: 1 / -1; }
.plan-grid span { font-size: 12px; color: var(--text-3); }
.plan-grid b { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.plan-flag { font-size: 14px; padding: 8px 10px; border-radius: 10px; border: 1px dashed var(--line); }
.plan-flag.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 55%, transparent); }
.plan-flag.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 55%, transparent); }
.rota { display: flex; flex-direction: column; }
.rrow { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 10px; align-items: center; padding: 8px 0; border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
.rrow:first-child { border-top: 0; }
.rday { border: 0; background: none; padding: 0; text-align: left; font-size: 14px; font-weight: 600; color: var(--blu); }
.rrow select { min-height: 40px; padding: 7px 10px; font-size: 15px; width: 100%; min-width: 0; }
.rtimes { grid-column: 2; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px; }
.rtimes input { min-height: 40px; padding: 7px 8px; width: 100%; min-width: 0; }
.rsum { grid-column: 2; font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.rsum:empty { display: none; }
.rsum.bad { color: var(--bad); }
.rsum.warn { color: var(--warn); }
.now { font-size: 15.5px; font-weight: 600; color: var(--ink-0); background: var(--blu); border-radius: 10px; padding: 9px 12px; line-height: 1.35; }
.times .adj { display: flex; gap: 6px; }
.times .adj button { min-width: 48px; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--ink-2); font-size: 14px; color: var(--text-2); }
.tonight { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.tonight .k { color: var(--gold); }
.tonight .seg button { text-align: left; }

.rest-card { border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
.rest-card h3 { color: var(--good); }

.wins-btn { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 10px 14px; border: 1px solid color-mix(in srgb, var(--gold) 40%, var(--line)); border-radius: var(--r); background: var(--ink-1); text-align: left; }
.wins-btn.rest { border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
.wins-t { font-size: 15px; color: var(--text-2); }
.wins-t b { color: var(--text); font-weight: 600; }
.sheet-body .viewpane { gap: 0; }
.sheet-body .r { flex-wrap: wrap; row-gap: 0; }
.sheet-body .r .r-m { flex-basis: 100%; text-align: left; padding-left: 36px; margin-top: -4px; }
.hm { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 4px; }
.hm select { min-height: 40px; padding: 7px 6px; font-size: 15px; min-width: 0; }
.times { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
.times .adj { grid-column: 1 / -1; }
.times .adj button { flex: 1; }
.rtimes select { min-height: 40px; padding: 7px 8px; width: 100%; min-width: 0; font-size: 15px; }
.appts { font-size: 14px; font-weight: 600; color: var(--gold); padding: 6px 10px; border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--line)); border-radius: 10px; }
.bet-must b { color: var(--warn); }
.trip-k .plain { font-family: var(--body); font-size: inherit; color: var(--text); font-weight: 600; }
.seg.full { grid-auto-flow: column; }

.seg.full button { padding-left: 6px; padding-right: 6px; white-space: nowrap; }

/* ---------- blocks ---------- */
.blocks { display: flex; flex-direction: column; gap: 6px; }
.blk { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--ink-2); border-left: 3px solid var(--line); }
.blk.k-music { border-left-color: var(--blu); }
.blk.k-s212 { border-left-color: var(--gold); }
.blk.k-job { border-left-color: var(--good); }
.blk.extra { opacity: 0.75; }
.blk input[type="checkbox"] { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; margin: 0; border: 1.6px solid var(--text-3); border-radius: 7px; display: grid; place-items: center; }
.blk input[type="checkbox"]:checked { background: var(--good); border-color: var(--good); }
.blk input[type="checkbox"]:checked::after { content: ""; width: 10px; height: 5px; border: 2.2px solid var(--ink-0); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.blk.done .blk-label { color: var(--text-3); text-decoration: line-through; }
.blk-main { min-width: 0; }
.blk-top { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.blk-label { font-size: 14.5px; line-height: 1.3; }
.blk select { min-height: 36px; padding: 5px 8px; font-size: 13px; width: auto; max-width: 104px; }
.quotas { display: flex; flex-wrap: wrap; gap: 6px; }
.q { display: flex; align-items: baseline; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; color: var(--text-2); }
.q b { font-variant-numeric: tabular-nums; color: var(--text); }
.q.k-music { border-color: color-mix(in srgb, var(--blu) 50%, var(--line)); }
.q.k-s212 { border-color: color-mix(in srgb, var(--gold) 50%, var(--line)); }
.q.k-job { border-color: color-mix(in srgb, var(--good) 50%, var(--line)); }
.q.met b { color: var(--good); }
.q.short span { color: var(--warn); }

.ms { display: flex; flex-direction: column; }
.ms .r { min-height: 42px; }
.ms .r-d { flex: 0 0 48px; }
.r.due.late .r-d { color: var(--bad); font-weight: 600; }
.r.due.done .r-t { color: var(--text-3); }
.auto { flex: 0 0 auto; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 7px; border: 1.6px solid var(--text-3); font-size: 11.5px; display: grid; place-items: center; color: var(--text-2); font-variant-numeric: tabular-nums; }
.auto.ok { background: var(--good); border-color: var(--good); color: var(--ink-0); font-weight: 700; }
.nextms { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: baseline; text-align: left; border: 0; border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); background: none; padding: 9px 0; font-size: 14.5px; line-height: 1.35; }
.nextms:first-of-type { border-top: 0; }
.nm-k { font-size: 12px; font-weight: 600; color: var(--text-3); }

/* ---------- assets & gates ---------- */
.assets { display: flex; flex-direction: column; gap: 8px; }
.asset { border: 1px solid var(--line); border-radius: 10px; background: var(--ink-2); }
.asset summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; min-height: 48px; }
.asset summary::-webkit-details-marker { display: none; }
.as-name { font-weight: 600; font-size: 15px; }
.as-st { font-size: 12.5px; color: var(--text-3); white-space: nowrap; }
.asset.ready .as-st { color: var(--good); font-weight: 600; }
.asset.late .as-st { color: var(--bad); font-weight: 600; }
.asset.late { border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); }
.as-body { padding: 0 12px 10px; display: flex; flex-direction: column; gap: 4px; }
.warn-t { color: var(--warn); font-weight: 600; }
.gate { font-size: 14px; line-height: 1.4; padding: 9px 12px; border-radius: 10px; border: 1px dashed color-mix(in srgb, var(--warn) 60%, var(--line)); color: var(--warn); }
.tapwrap.blocked .tap { opacity: 0.45; }
.blk.k-asset, .q.k-asset { border-color: var(--warn); }
.blk.k-asset { border-left-color: var(--warn); }
</style>
</head>

/* ---------------- lock ---------------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const lockEl = $('#lock'), appEl = $('#app');
const stageLabels = ['code one', 'code two', 'pick a letter on the keyboard'];
let stage = 0, buf = '', parts = [], busy = false, fails = 0, coolUntil = 0;

function buildLockUI() {
  const kp = $('#keypad');
  ['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'key' + (k === '' || k === '⌫' ? ' ghost' : ''); b.textContent = k;
    if (k === '') { b.disabled = true; b.setAttribute('aria-hidden', 'true'); }
    else if (k === '⌫') { b.setAttribute('aria-label', 'Delete'); b.addEventListener('click', backspace); }
    else b.addEventListener('click', () => pressDigit(k));
    kp.appendChild(b);
  });
  const lt = $('#letters');
  ['qwertyuiop', 'asdfghjkl', 'zxcvbnm⌫'].forEach(row => {
    const r = document.createElement('div'); r.className = 'lrow';
    for (const ch of row) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'lkey' + (ch === '⌫' ? ' wide' : ''); b.textContent = ch;
      if (ch === '⌫') { b.setAttribute('aria-label', 'Back'); b.addEventListener('click', backspace); }
      else b.addEventListener('click', () => pressLetter(ch));
      r.appendChild(b);
    }
    lt.appendChild(r);
  });
  document.addEventListener('keydown', e => {
    if (lockEl.hidden) { if (e.key === 'Escape') closeSheet(); return; }
    if (busy) return;
    if (e.key === 'Backspace') { e.preventDefault(); backspace(); return; }
    if (stage < 2 && /^[0-9]$/.test(e.key)) pressDigit(e.key);
    else if (stage === 2 && /^[a-zA-Z]$/.test(e.key)) pressLetter(e.key);
  });
}
function renderLock() {
  $('#stageLabel').textContent = stageLabels[stage];
  $$('.stages span').forEach((s, i) => s.classList.toggle('on', i <= stage));
  $('#dots').hidden = stage === 2;
  $$('#dots span').forEach((d, i) => d.classList.toggle('on', i < buf.length));
  $('#keypad').hidden = stage === 2;
  $('#letters').hidden = stage !== 2;
}
function cooling() { const left = Math.ceil((coolUntil - Date.now()) / 1000); if (left > 0) { $('#lockMsg').textContent = `too many tries. wait ${left}s.`; return true; } return false; }
function pressDigit(d) { if (busy || stage > 1 || cooling()) return; $('#lockMsg').textContent = ''; buf += d; if (buf.length === 4) { parts[stage] = buf; buf = ''; stage++; } renderLock(); }
function pressLetter(ch) { if (busy || stage !== 2 || cooling()) return; parts[2] = ch.toLowerCase(); tryUnlock(); }
function backspace() { if (busy) return; if (buf.length) buf = buf.slice(0, -1); else if (stage > 0) { stage--; buf = ''; parts.length = stage; } renderLock(); }
function resetLock(msg) { stage = 0; buf = ''; parts = []; busy = false; renderLock(); $('#lockMsg').textContent = msg || ''; }
async function tryUnlock() {
  busy = true; $('#stageLabel').textContent = 'opening…';
  try {
    const p = PAYLOAD;
    const k = await deriveKey(parts.join('·'), fromB64(p.salt), p.iter);
    const html = await openText(k, p.iv, p.ct);
    fails = 0; key = k;
    try { localStorage.setItem('s20k.k', toB64(await crypto.subtle.exportKey('raw', k))); } catch (e) {}
    await mount(html);
  } catch (e) {
    fails++; if (fails >= 5) { coolUntil = Date.now() + 30000; fails = 0; }
    const inner = $('#lockInner'); inner.classList.remove('shake'); void inner.offsetWidth; inner.classList.add('shake');
    resetLock("that didn't open it. start again.");
  }
}

  const nl = $('[data-now]', appEl);
  if (nl) { const t = nowLine(); nl.textContent = t; nl.hidden = !t; }
}

function moveMaths() {
  const S = state.settings, now = num(S.mvRentNow), nw = num(S.mvRentNew);
  let overlap = 0;
  if (S.mvNewStart && S.mvOldEnd && now) { const days = Math.round((parse(S.mvOldEnd).getTime() - parse(S.mvNewStart).getTime()) / 86400000); if (days > 0) overlap = days * now * 12 / 365; }
  const out = (num(S.mvDeposit) || 0) + (nw || 0) + (num(S.mvRemovals) || 0) + overlap;
  const saving = now && nw ? now - nw : 0;
  const freedom = saving ? (num(S.freedom) || 0) - saving : null;
  return { out, overlap, back: num(S.mvOldDeposit) || 0, saving, freedom };
}

/* ---------------- outputs ---------------- */
const weekDays = wk => Array.from({ length: 7 }, (_, i) => addDays(wk, i));
const startBal = () => num(state.settings.startBal) || 0;
function lineAt(name, ds) {
  const pts = cfg.lines[name], t = parse(ds).getTime(), T = pts.map(p => parse(p[0]).getTime());
  if (t <= T[0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) if (t <= T[i]) { const f = (t - T[i - 1]) / (T[i] - T[i - 1]); return pts[i - 1][1] + f * (pts[i][1] - pts[i - 1][1]); }
  return null;
}
function latestBalance() { const ks = Object.keys(state.weeks).filter(k => num(state.weeks[k].balance) !== null).sort(); if (!ks.length) return null; const k = ks[ks.length - 1]; return { week: k, bal: num(state.weeks[k].balance) }; }
function statusOf(ds, bal) {
  const added = bal - startBal(), sp = lineAt('sprint', ds), fl = lineAt('floor', ds);
  if (sp !== null && added >= sp) return { text: cfg.statusText.ahead, cls: 'good' };
  if (fl === null || added >= fl) return { text: cfg.statusText.between, cls: 'warn' };
  return { text: cfg.statusText.behind, cls: 'bad' };
}
function dayDone() { const b = $$('[data-page="today"] input[type="checkbox"][data-bind^="d:"], [data-page="today"] input[data-blockdone]', appEl).filter(x => !x.closest('[hidden]')); return [b.filter(x => x.checked).length, b.length]; }
function out(spec, ctx) {
  const wk = (ctx && ctx.week) || curWeek;
  const [name, a, b, c] = spec.split(':');
  const days = () => weekDays(wk).map(d => state.days[d] || {});
  switch (name) {
    case 'dayLabel': return fmtDay(curDay) + (curDay === logicalToday() ? ' · today' : '');
    case 'weekLabel': return 'W/c ' + fmtShort(wk) + (wk === mondayOf(logicalToday()) ? ' · now' : '');
    case 'weekShort': return fmtShort(wk);
    case 'wsum': { const s = days().reduce((t, d) => t + (num(d[a]) || 0), 0); return String(Math.round(s * 10) / 10); }
    case 'wavg': { const v = days().map(d => num(d[a])).filter(x => x !== null && x !== 0); return v.length ? (v.reduce((t, x) => t + x, 0) / v.length).toFixed(1) : '–'; }
    case 'wcount': return String(days().filter(d => !!d[a]).length);
    case 'wcountx': { const fs = a.split(','); return String(days().reduce((t, d) => t + fs.filter(f => !!d[f]).length, 0)); }
    case 'wval': { const v = num((state.weeks[wk] || {})[a]); return v === null ? '–' : gbp(v); }
    case 'wadded': { const v = num((state.weeks[wk] || {}).balance); return v === null ? '–' : gbp(v - startBal()); }
    case 'wstatus': { const v = num((state.weeks[wk] || {}).balance); return v === null ? { text: 'log a balance', cls: '' } : statusOf(wk, v); }
    case 'balance': { const lb = latestBalance(); return gbp(lb ? lb.bal : startBal()); }
    case 'pct': { const lb = latestBalance(); const v = lb ? lb.bal : startBal(); return Math.max(0, Math.min(100, Math.round(v / Number(a) * 100))) + '%'; }
    case 'status': { const lb = latestBalance(); return lb ? statusOf(lb.week, lb.bal) : { text: cfg.statusText.none, cls: '' }; }
    case 'mtarget': { const d = parse(wk); const me = iso(new Date(d.getFullYear(), d.getMonth() + 1, 0)); const v = lineAt(a, me); return v === null ? '–' : gbp(v + startBal()); }
    case 'listcount': { const [f, vals] = b.split('='); const set = vals.split(','); return String((state.lists[a] || []).filter(x => set.includes(String(x[f]))).length); }
    case 'listsum': { let items = state.lists[a] || []; if (c) { const [f, vals] = c.split('='); const set = vals.split(','); items = items.filter(x => set.includes(String(x[f]))); } return gbp(items.reduce((t, x) => t + (num(x[b]) || 0), 0)); }
    case 'capleft': { const spent = (state.lists[b] || []).reduce((t, x) => t + (num(x[c]) || 0), 0); return gbp(Number(a) - spent); }
    case 'daysto': { const t = parse(a).getTime() - parse(todayIso()).getTime(); return String(Math.max(0, Math.round(t / 86400000))); }
    case 'n': { const v = num(getV(a + ':' + b)); return v === null ? (c || '0') : String(v); }
    case 'stmtShort': { const s = String(state.settings.statement || ''); const m = s.match(/^.*?[.!?](\s|$)/); return (m ? m[0] : s).trim(); }
    case 'cutoff': { const f = String(state.settings.sleepFrom || '02:00').split(':').map(Number); let h = (f[0] - Number(a) + 24) % 24; return pad(h) + ':' + pad(f[1] || 0); }
    case 'nextdue': { const d = (cfg.deadlines || []).find(x => !state.checks[x.key]); if (!d) return 'all done'; return d.label + ' · ' + fmtShort(d.date); }
    case 'daydone': { const [done, all] = dayDone(); return done + ' / ' + all; }
    case 'dcount': { const ps = a.split(','), d = state.days[curDay] || {}; return String(Object.keys(d).filter(k => d[k] && ps.some(p => k.startsWith(p))).length); }
    case 'wcountp': { const ps = a.split(','); return String(days().reduce((t, d) => t + Object.keys(d).filter(k => d[k] && ps.some(p => k.startsWith(p))).length, 0)); }
    case 'fmt': { const v = getV(a + ':' + b); return v ? fmtShort(v) : '–'; }
    case 'daystos': { const v = state.settings[a]; if (!v) return '–'; const t = parse(v).getTime() - parse(todayIso()).getTime(); return String(Math.max(0, Math.round(t / 86400000))); }
    case 'ccount': return String(Object.keys(state.checks).filter(k => k.startsWith(a) && state.checks[k]).length);
    case 'move': { const m = moveMaths(); if (a === 'freedom') return m.freedom === null ? '–' : gbp(m.freedom); return gbp(m[a] || 0); }
    case 'mscount': { const l = (cfg.milestones || {})[a] || []; return l.filter(m => msStatus(m).done).length + '/' + l.length; }
    case 'nextms': return nextMilestone(a);
    case 'phase': { const ph = phaseFor(wk); return ph.name; }
    case 'wbar': { const h = weekBarHours(wk); return String(Math.round(h * 10) / 10); }
    case 'plan': {
      const pl = dayPlan(curDay);
      if (a === 'caffeine' && (!pl || pl.incomplete)) { const f = String(state.settings.sleepFrom || '02:00').split(':').map(Number); return pad((f[0] - 6 + 24) % 24) + ':' + pad(f[1] || 0); }
      if (!pl) return a === 'label' ? cfg.rota.text.pick : a === 'flag' ? '' : '–';
      if (pl.incomplete) return a === 'label' ? pl.label : a === 'flag' ? '' : '–';
      if (a === 'label') return pl.label;
      if (a === 'up' || a === 'bed' || a === 'caffeine') return hm(pl[a]);
      if (a === 'money' || a === 'block') return pl[a];
      if (a === 'eve') return pl.eveA !== undefined ? rng(pl.eveA, pl.eveB) + ' · ' + dur(pl.eveB - pl.eveA) : '';
      if (a === 'flag') return pl.flags.length ? pl.flags[0] : '';
      return '';

  }
  return '';
}
function computeAll() {
  if (!state) return;
  if (cfg && cfg.alloc) paintBlocks();
  if (cfg && cfg.milestones) paintMilestones();
  if (cfg && cfg.assets) paintAssets();
  const rk0 = getV('d:rota') || '';
  $$('[data-hideon]', appEl).forEach(el => { el.hidden = el.dataset.hideon.split(',').includes(rk0); });
  $$('[data-showon]', appEl).forEach(el => { el.hidden = !el.dataset.showon.split(',').includes(rk0); });
  $$('[data-out]', appEl).forEach(el => {
    const r = out(el.dataset.out);
    if (typeof r === 'object') { el.textContent = r.text; el.classList.remove('good', 'warn', 'bad'); if (r.cls) el.classList.add(r.cls); } else el.textContent = r;
  });
  const lb = latestBalance(); const v = lb ? lb.bal : startBal();
  $$('[data-bar]', appEl).forEach(el => el.style.width = Math.max(0, Math.min(100, v / Number(el.dataset.bar) * 100)) + '%');
  $$('[data-meter]', appEl).forEach(m => {
    const val = num(out(m.dataset.meter)) || 0, tgt = Number(m.dataset.target), floor = num(m.dataset.floor), max = num(m.dataset.max);
    const f = $('.meter-fill', m); if (f) f.style.width = Math.min(100, val / tgt * 100) + '%';
    if (max !== null) { m.classList.toggle('good', false); m.classList.toggle('bad', val > max); return; }
    m.classList.toggle('good', val >= tgt);
    m.classList.toggle('bad', floor !== null && val > 0 && val < floor);
  });
  $$('[data-goal]', appEl).forEach(g => g.classList.toggle('met', (num(out(g.dataset.goalof)) || 0) >= Number(g.dataset.goal)));
  const [done, all] = dayDone();
  $$('[data-daybar]', appEl).forEach(el => { el.style.width = (all ? done / all * 100 : 0) + '%'; el.classList.toggle('good', all && done === all); });
  $$('[data-if="nottoday"]', appEl).forEach(el => el.hidden = curDay === logicalToday());
  paintShiftCard();
  $$('[data-out="plan:flag"]', appEl).forEach(el => el.hidden = !el.textContent);
  paintRota();
  let nextSet = false;
  $$('[data-due]', appEl).forEach(r => { const d = !!getV(r.dataset.due); r.classList.toggle('done', d); const nx = !d && !nextSet; r.classList.toggle('next', nx); if (nx) nextSet = true; });
  renderHistory(); drawChart();
}
function renderHistory() {
  const t = $('[data-history]', appEl); if (!t) return;
  const weeks = Object.keys(state.weeks).filter(k => num(state.weeks[k].balance) !== null).sort().reverse();
  t.innerHTML = '';
  const head = t.insertRow(); cfg.history.forEach(h => { const th = document.createElement('th'); th.textContent = h.label; head.appendChild(th); });
  if (!weeks.length) { const r = t.insertRow(); const td = r.insertCell(); td.colSpan = cfg.history.length; td.className = 'empty'; td.textContent = 'Log a balance on a Monday and it shows up here.'; return; }
  weeks.forEach(w => { const r = t.insertRow(); cfg.history.forEach(h => { const v = out(h.out, { week: w }); r.insertCell().textContent = typeof v === 'object' ? v.text : v; }); });
}

/* ---------------- chart ---------------- */
function drawChart() {
  if (!state || !cfg) return;
  const host = $('[data-chart]', appEl); if (!host || !host.offsetParent) return;
  const W = Math.max(300, host.clientWidth), H = 210, m = { l: 40, r: 10, t: 10, b: 24 };
  const x0 = parse(cfg.chart.from).getTime(), x1 = parse(cfg.chart.to).getTime();
  const sb = startBal(), ymax = Math.max(cfg.chart.ymax, sb + 2000);
  const X = t => m.l + (t - x0) / (x1 - x0) * (W - m.l - m.r), Y = v => m.t + (1 - v / ymax) * (H - m.t - m.b);
  const css = getComputedStyle(document.documentElement), c = n => css.getPropertyValue(n).trim();
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', 'Liquid balance against the sprint and floor lines');
  const el = (tag, at) => { const e = document.createElementNS(ns, tag); for (const k in at) e.setAttribute(k, at[k]); svg.appendChild(e); return e; };
  [0, 5000, 10000, 15000, 20000].filter(v => v <= ymax).forEach(v => {
    el('line', { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: c('--line'), 'stroke-width': v === 10000 || v === 20000 ? 1 : 0.5 });
    el('text', { x: m.l - 6, y: Y(v) + 4, 'text-anchor': 'end', 'font-size': 11, fill: c('--text-3') }).textContent = v ? '£' + v / 1000 + 'k' : '£0';
  });
  ['2026-12-01', '2027-02-01', '2027-04-01', '2027-06-01', '2027-08-01', '2027-10-01'].forEach(d => {
    el('text', { x: X(parse(d).getTime()), y: H - 5, 'text-anchor': 'middle', 'font-size': 11, fill: c('--text-3') }).textContent = parse(d).toLocaleDateString('en-GB', { month: 'short' });
  });
  const pathOf = pts => pts.map((p, i) => (i ? 'L' : 'M') + X(parse(p[0]).getTime()).toFixed(1) + ' ' + Y(p[1] + sb).toFixed(1)).join(' ');
  el('path', { d: pathOf(cfg.lines.floor), fill: 'none', stroke: c('--text-3'), 'stroke-width': 2, 'stroke-dasharray': '5 5' });
  el('path', { d: pathOf(cfg.lines.sprint.filter(p => p[1] + sb <= ymax)), fill: 'none', stroke: c('--blu'), 'stroke-width': 2, 'stroke-dasharray': '5 5' });
  const ptsA = Object.keys(state.weeks).filter(k => num(state.weeks[k].balance) !== null).sort().map(k => [k, num(state.weeks[k].balance)]);
  const series = [[cfg.start, sb], ...ptsA.filter(p => p[0] >= cfg.start)];
  if (series.length > 1) el('path', { d: series.map((p, i) => (i ? 'L' : 'M') + X(parse(p[0]).getTime()).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' '), fill: 'none', stroke: c('--gold'), 'stroke-width': 2, 'stroke-linejoin': 'round' });
  const last = series[series.length - 1];
  el('circle', { cx: X(parse(last[0]).getTime()), cy: Y(last[1]), r: 5, fill: c('--gold'), stroke: c('--ink-1'), 'stroke-width': 2 });
  const cross = el('line', { x1: 0, x2: 0, y1: m.t, y2: H - m.b, stroke: c('--text-3'), 'stroke-width': 1, opacity: 0 });
  host.innerHTML = ''; host.appendChild(svg);
  const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; host.appendChild(tip);
  const hit = document.createElementNS(ns, 'rect'); hit.setAttribute('x', m.l); hit.setAttribute('y', 0); hit.setAttribute('width', W - m.l - m.r); hit.setAttribute('height', H); hit.setAttribute('fill', 'transparent'); svg.appendChild(hit);
  const move = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * (W / r.width);
    const t = x0 + (px - m.l) / (W - m.l - m.r) * (x1 - x0); if (t < x0 || t > x1) return;
    const ds = iso(new Date(t)), sp = lineAt('sprint', ds), fl = lineAt('floor', ds);
    const near = series.reduce((best, p) => Math.abs(parse(p[0]).getTime() - t) < Math.abs(parse(best[0]).getTime() - t) ? p : best, series[0]);
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('opacity', 0.6);
    tip.innerHTML = '';
    const lines = [fmtShort(ds)];
    if (Math.abs(parse(near[0]).getTime() - t) < 6 * 86400000) lines.push('you ' + gbp(near[1]));
    if (sp !== null) lines.push('sprint ' + gbp(sp + sb));
    if (fl !== null) lines.push('floor ' + gbp(fl + sb));
    lines.forEach(s => { const d = document.createElement('div'); d.textContent = s; tip.appendChild(d); });
    tip.hidden = false; tip.style.left = Math.min(Math.max(px / (W / r.width), 60), r.width - 60) + 'px'; tip.style.top = '6px'; tip.style.transform = 'translateX(-50%)';
  };
  hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', () => { tip.hidden = true; cross.setAttribute('opacity', 0); });
}

/* ---------------- vault ---------------- */
async function backup() {
  await doSave();
  const text = JSON.stringify(await sealState());
  const ta = $('[data-vaulttext]', appEl), msg = $('[data-vaultmsg]', appEl); ta.value = text;
  try { await navigator.clipboard.writeText(text); msg.textContent = 'Encrypted backup copied. Paste it into your Notes; it only opens with your codes.'; }
  catch (e) { ta.select(); msg.textContent = 'Copy the encrypted backup from the box above.'; }
}
async function restore() {
  const msg = $('[data-vaultmsg]', appEl); let box;
  try { box = JSON.parse($('[data-vaulttext]', appEl).value.trim()); } catch (e) { msg.textContent = "That isn't a backup. Paste the whole text, curly brackets included."; return; }
  const s = await openBox(box); if (!s) { msg.textContent = "That backup doesn't open with these codes."; return; }
  state = normalise(s); renderAll(); await doSave(); msg.textContent = 'Restored.';
}

/* ---------------- mount / lock ---------------- */
function renderAll() { Object.keys(cfg.defaults.lists).forEach(renderList); fillRotaSelects(); renderRota(); syncBound(); computeAll(); }
let wired = false;

  appEl.innerHTML = html;

  appEl.innerHTML = ''; appEl.hidden = true; lockEl.hidden = false;

buildLockUI(); renderLock();
(async () => {
  let raw = null; try { raw = localStorage.getItem('s20k.k'); } catch (e) {}
  if (!raw) return;
  try {
    const k = await crypto.subtle.importKey('raw', fromB64(raw), { name: 'AES-GCM' }, true, ['encrypt', 'decrypt']);
    const html = await openText(k, PAYLOAD.iv, PAYLOAD.ct);
    key = k; busy = true; await mount(html);
  } catch (e) { try { localStorage.removeItem('s20k.k'); } catch (e2) {} }
})();
